# SEVIR pretraining data, 5-min frames subsampled to 10 min, 384 km resampled to 128 px (3 km).
# Default: contract Zarr stores made by scripts/download_sevir_subset.py + scripts/sevir_to_zarr.py.
# Set events_dir: null to read the original HDF5 files + CATALOG.csv under sevir.root instead.
# channels: all 14 (default). Channels SEVIR lacks are marked unavailable, so the
# pretrained checkpoint has the same input layout as the India fine-tune.
source: sevir
events_dir: data/sevir_events
grid_spacing_km: 3.0
t_in: 7
t_out: 12
step_minutes: 10
crop: null
sample_stride: 1
batch_size: 16
num_workers: 0   # macOS spawn + persistent workers hang under Lightning; use 2-4 on Linux/Colab
sevir:
  root: data/sevir
  catalog: CATALOG.csv
  size: 128
  frame_stride: 2
  max_events: null
